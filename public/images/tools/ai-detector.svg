<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">AI Detector — a magnifier inspecting text for AI writing</title>
  <rect x="6" y="6" width="388" height="288" rx="18" fill="#faf6ef" stroke="#e6ddcb" stroke-width="2"/>
  <!-- document under inspection -->
  <g stroke="#1d1a16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="80" y="56" width="138" height="158" rx="8" fill="#fffdf7"/>
    <path d="M202 56v16h16" fill="none" stroke-width="4"/>
  </g>
  <g stroke="#1d1a16" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <path d="M96 92h106M96 110h106M96 128h84M96 182h84M96 198h60"/>
  </g>
  <!-- scan line sweeping toward the magnifier -->
  <path d="M72 158h148" stroke="#cf3618" stroke-width="4" stroke-linecap="round"/>
  <polygon points="230,158 216,150 216,166" fill="#cf3618"/>
  <!-- magnifier -->
  <circle cx="252" cy="166" r="36" fill="#faf6ef" stroke="#1d1a16" stroke-width="5"/>
  <path d="M280 194l28 28" stroke="#1d1a16" stroke-width="6" stroke-linecap="round"/>
  <!-- robot face inside the lens -->
  <g stroke="#cf3618" stroke-width="5" fill="none" stroke-linecap="round">
    <rect x="232" y="146" width="40" height="32" rx="8"/>
    <path d="M252 146v-12"/>
  </g>
  <circle cx="252" cy="130" r="4.5" fill="#cf3618"/>
  <circle cx="243" cy="162" r="3.5" fill="#cf3618"/>
  <circle cx="261" cy="162" r="3.5" fill="#cf3618"/>
  <path d="M243 170h18" stroke="#cf3618" stroke-width="4" stroke-linecap="round"/>
</svg>
