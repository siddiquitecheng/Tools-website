  <circle cx="218" cy="196" r="8" fill="#1d1a16"/>
  <!-- result chip -->
  <rect x="180" y="218" width="78" height="25" rx="6" fill="#cf3618"/>
  <text x="219" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1" fill="#faf6ef">BMI 22</text>
</svg>
