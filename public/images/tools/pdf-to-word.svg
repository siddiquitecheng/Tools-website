<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">PDF to Word — a PDF converts into an editable DOCX document</title>
  <rect x="6" y="6" width="388" height="288" rx="18" fill="#faf6ef" stroke="#e6ddcb" stroke-width="2"/>
  <!-- source PDF document -->
  <g stroke="#1d1a16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="50" y="82" width="88" height="116" rx="8" fill="#fffdf7"/>
    <path d="M122 82v16h16" fill="none" stroke-width="4"/>
  </g>
  <g stroke="#1d1a16" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <path d="M66 118h56M66 136h56M66 154h40"/>
  </g>
  <rect x="64" y="186" width="60" height="25" rx="6" fill="#cf3618"/>
  <text x="94" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#faf6ef">PDF</text>
  <!-- conversion spark + arrow -->
  <path d="M196 78l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#cf3618"/>
  <path d="M160 140h68" stroke="#cf3618" stroke-width="5" stroke-linecap="round"/>
  <polygon points="242,140 226,131 226,149" fill="#cf3618"/>
  <!-- result DOCX document -->
  <g stroke="#1d1a16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="256" y="82" width="88" height="116" rx="8" fill="#fffdf7"/>
    <path d="M328 82v16h16" fill="none" stroke-width="4"/>
  </g>
  <g stroke="#1d1a16" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <path d="M272 118h56M272 136h56M272 154h40"/>
  </g>
  <rect x="262" y="186" width="76" height="25" rx="6" fill="#faf6ef" stroke="#1d1a16" stroke-width="3.5"/>
  <text x="300" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1" fill="#1d1a16">DOCX</text>
</svg>
