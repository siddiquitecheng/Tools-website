<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Password Generator — a masked password field and a key</title>
  <rect x="6" y="6" width="388" height="288" rx="18" fill="#faf6ef" stroke="#e6ddcb" stroke-width="2"/>
  <!-- password field -->
  <rect x="66" y="64" width="268" height="62" rx="12" fill="#fffdf7" stroke="#1d1a16" stroke-width="5"/>
  <g fill="#1d1a16">
    <circle cx="98" cy="95" r="5.5"/>
    <circle cx="128" cy="95" r="5.5"/>
    <circle cx="158" cy="95" r="5.5"/>
    <circle cx="188" cy="95" r="5.5"/>
    <circle cx="218" cy="95" r="5.5"/>
    <circle cx="248" cy="95" r="5.5"/>
  </g>
  <!-- fresh-character asterisk -->
  <path d="M288 85v20M279 89l18 12M279 101l18-12" stroke="#cf3618" stroke-width="4" stroke-linecap="round"/>
  <!-- key -->
  <g stroke="#cf3618" stroke-width="6" stroke-linecap="round" fill="none">
