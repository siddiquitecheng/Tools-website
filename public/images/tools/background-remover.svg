<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Background Remover — a subject cut out from its background</title>
  <rect x="6" y="6" width="388" height="288" rx="18" fill="#faf6ef" stroke="#e6ddcb" stroke-width="2"/>
  <path d="M322 34l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#cf3618"/>
  <!-- photo frame -->
  <rect x="100" y="56" width="200" height="152" rx="10" fill="#fffdf7" stroke="#1d1a16" stroke-width="5"/>
  <!-- transparency checkerboard corners -->
  <g fill="none" stroke="#1d1a16" stroke-width="3.5" opacity="0.45">
    <rect x="112" y="68" width="16" height="16"/>
    <rect x="128" y="68" width="16" height="16"/>
    <rect x="112" y="84" width="16" height="16"/>
    <rect x="128" y="84" width="16" height="16"/>
    <rect x="254" y="174" width="16" height="16"/>
    <rect x="270" y="174" width="16" height="16"/>
    <rect x="254" y="190" width="16" height="16"/>
    <rect x="270" y="190" width="16" height="16"/>
  </g>
  <!-- cut-out selection outline -->
  <rect x="156" y="76" width="88" height="122" rx="10" fill="none" stroke="#cf3618" stroke-width="4" stroke-dasharray="9 7"/>
  <!-- subject -->
  <circle cx="200" cy="112" r="17" fill="#fffdf7" stroke="#1d1a16" stroke-width="5"/>
  <path d="M166 186a34 30 0 0 1 68 0" fill="#fffdf7" stroke="#1d1a16" stroke-width="5" stroke-linecap="round"/>
</svg>
