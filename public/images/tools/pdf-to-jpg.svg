<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">PDF to JPG — PDF pages rendered as JPG images</title>
  <rect x="6" y="6" width="388" height="288" rx="18" fill="#faf6ef" stroke="#e6ddcb" stroke-width="2"/>
  <!-- source PDF document -->
  <g stroke="#1d1a16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="50" y="78" width="92" height="122" rx="8" fill="#fffdf7"/>
    <path d="M126 78v16h16" fill="none" stroke-width="4"/>
  </g>
  <g stroke="#1d1a16" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <path d="M66 114h60M66 132h60M66 150h42"/>
  </g>
  <rect x="66" y="186" width="60" height="25" rx="6" fill="#cf3618"/>
  <text x="96" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#faf6ef">PDF</text>
  <!-- conversion spark + arrow -->
  <path d="M200 78l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#cf3618"/>
  <path d="M164 140h60" stroke="#cf3618" stroke-width="5" stroke-linecap="round"/>
  <polygon points="238,140 222,131 222,149" fill="#cf3618"/>
  <!-- result photo -->
  <rect x="250" y="88" width="110" height="90" rx="8" fill="#fffdf7" stroke="#1d1a16" stroke-width="5"/>
  <circle cx="278" cy="112" r="9" fill="none" stroke="#1d1a16" stroke-width="4"/>
  <path d="M260 164l30-36 20 20 14-14 26 30" fill="none" stroke="#1d1a16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="274" y="190" width="62" height="25" rx="6" fill="#cf3618"/>
  <text x="305" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1" fill="#faf6ef">JPG</text>
</svg>
