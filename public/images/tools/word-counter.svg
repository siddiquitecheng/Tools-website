<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Word Counter — text lines tallied into a word count</title>
  <rect x="6" y="6" width="388" height="288" rx="18" fill="#faf6ef" stroke="#e6ddcb" stroke-width="2"/>
  <!-- document being counted -->
  <g stroke="#1d1a16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="88" y="62" width="126" height="148" rx="8" fill="#fffdf7"/>
    <path d="M198 62v16h16" fill="none" stroke-width="4"/>
  </g>
  <g stroke="#1d1a16" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <path d="M104 98h94M104 116h94M104 134h94M104 152h64M104 176h84"/>
  </g>
  <!-- tally rows with counter beads -->
  <g stroke="#1d1a16" stroke-width="4" stroke-linecap="round">
    <path d="M240 100h76"/>
    <path d="M240 132h76"/>
    <path d="M240 164h76"/>
  </g>
  <circle cx="262" cy="100" r="7" fill="#cf3618"/>
  <circle cx="290" cy="132" r="7" fill="#cf3618"/>
  <circle cx="252" cy="164" r="7" fill="#cf3618"/>
  <!-- count chip -->
  <rect x="243" y="196" width="76" height="25" rx="6" fill="#cf3618"/>
  <text x="281" y="213" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#faf6ef">WORDS</text>
</svg>
