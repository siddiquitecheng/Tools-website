<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Currency Converter — dollars exchanged into euros</title>
  <rect x="6" y="6" width="388" height="288" rx="18" fill="#faf6ef" stroke="#e6ddcb" stroke-width="2"/>
  <path d="M200 40l3.5 8.5 8.5 3.5-8.5 3.5-3.5 8.5-3.5-8.5-8.5-3.5 8.5-3.5z" fill="#cf3618"/>
  <!-- dollar coin -->
  <circle cx="116" cy="132" r="44" fill="#fffdf7" stroke="#1d1a16" stroke-width="5"/>
  <circle cx="116" cy="132" r="32" fill="none" stroke="#1d1a16" stroke-width="3.5"/>
  <text x="116" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#1d1a16">$</text>
  <!-- exchange arrows -->
  <path d="M172 118h56" stroke="#cf3618" stroke-width="5" stroke-linecap="round"/>
  <polygon points="242,118 226,109 226,127" fill="#cf3618"/>
  <path d="M228 148h-56" stroke="#cf3618" stroke-width="5" stroke-linecap="round"/>
  <polygon points="158,148 174,139 174,157" fill="#cf3618"/>
  <!-- euro coin -->
  <circle cx="284" cy="132" r="44" fill="#fffdf7" stroke="#1d1a16" stroke-width="5"/>
  <circle cx="284" cy="132" r="32" fill="none" stroke="#1d1a16" stroke-width="3.5"/>
  <text x="284" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#1d1a16">€</text>
  <!-- small spare coins -->
  <circle cx="70" cy="228" r="13" fill="none" stroke="#1d1a16" stroke-width="4" opacity="0.45"/>
  <circle cx="330" cy="228" r="13" fill="none" stroke="#1d1a16" stroke-width="4" opacity="0.45"/>
</svg>
